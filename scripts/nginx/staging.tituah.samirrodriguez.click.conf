# Static Vite client + WebSocket game server (PM2: tituah-staging → :4080)
# Frontend: /var/www/staging.tituah.samirrodriguez.click
# Game WS:  proxy /ws → 127.0.0.1:4080
#
# First deploy installs this HTTP config, then certbot adds SSL.
# Do not overwrite this file after certbot has added the certificate blocks.

server {
    listen 80;
    server_name staging.tituah.samirrodriguez.click;

    root /var/www/staging.tituah.samirrodriguez.click;
    index index.html;

    location /api {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
